# Do not put a real API key in this file. Create this Secret from a local
# environment variable or use an external secret manager.
#
# Local setup:
#   kubectl create secret generic packing-list-agent-secrets \
#     --from-literal=OPENAI_API_KEY="$env:OPENAI_API_KEY" \
#     --namespace=packing-list-agent
#
# External-secret controllers should create a Secret with this name and key.
apiVersion: v1
kind: Secret
metadata:
  name: packing-list-agent-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "DO_NOT_COMMIT_A_REAL_KEY"
